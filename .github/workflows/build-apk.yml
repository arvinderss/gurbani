name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'dist/**'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write release signing key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore-release.jks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Assemble the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/gurbani-reader.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: pothi-sahib-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Pothi Sahib (Android)
          files: android/app/build/outputs/apk/release/*.apk
          update_existing_files: true
          body: |
            Offline Gurbani reader (`Pothi Sahib`, v1.0.0).

            **Install:** download `gurbani-reader.apk` and open it on the phone —
            allow "install unknown apps" when prompted.

            This release is rebuilt and re-signed automatically from the latest
            `main`, so it updates the app in place on devices that already have
            it installed.
          draft: false
          fail_on_unmatched_files: false